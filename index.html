<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Save the Cow — Shepherd Game</title>
<style>
    html,body{height:100%;margin:0;font-family:Segoe UI,Roboto,Arial;background:#e8f7ff}
    #game{display:flex;flex-direction:column;align-items:center;padding:12px;box-sizing:border-box}
    canvas{background:linear-gradient(#c8f0d8,#9fd6b8);border:6px solid #2b6b3a;border-radius:8px;touch-action:none}
    .hud{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;margin:8px 0}
    .btn{background:#2b6b3a;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer}
    .info{font-size:14px;color:#16371f}
    .msg{font-weight:700;color:#0b4b25}
</style>
</head>
<body>
<div id="game">
    <div class="hud" style="max-width:900px;width:100%;">
        <div class="info">Use WASD / Arrows to move. Space to scare enemies. Herd the cow into the barn (brown rectangle).</div>
        <div>
            <button id="startBtn" class="btn">Start / Restart</button>
        </div>
    </div>
    <canvas id="c" width="900" height="600"></canvas>
    <div class="hud" style="max-width:900px;width:100%;justify-content:flex-start;">
        <div class="msg" id="status">Ready</div>
    </div>
</div>

<script>
(() => {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W = canvas.width, H = canvas.height;

    // Game objects
    const player = {x:100,y: H/2, r:14, speed:220, vx:0, vy:0, stunCooldown:0};
    const cow = {x:200,y: H/2, r:18, vx:0, vy:0, calmTimer:0};
    const barn = {x: W-120, y: 60, w:120, h:80};
    let enemies = [];
    let spawnTimer = 0;
    let last = performance.now();
    let keys = {};
    let state = 'idle'; // 'idle','playing','won','lost'
    const statusEl = document.getElementById('status');

    function reset() {
        player.x = 100; player.y = H/2; player.stunCooldown = 0;
        cow.x = 200; cow.y = H/2; cow.calmTimer = 0;
        enemies = [];
        spawnTimer = 0;
        state = 'playing';
        statusEl.textContent = 'Protect the cow!';
        last = performance.now();
    }

    document.getElementById('startBtn').addEventListener('click', ()=>reset());

    // Controls
    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if(e.key===' '){ e.preventDefault(); } });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    // Touch: simple joystick by touching canvas
    let touchTarget = null;
    canvas.addEventListener('pointerdown', e => {
        const rect = canvas.getBoundingClientRect();
        touchTarget = {x: (e.clientX-rect.left) * (canvas.width/rect.width), y: (e.clientY-rect.top) * (canvas.height/rect.height)};
    });
    canvas.addEventListener('pointermove', e => {
        if (!touchTarget) return;
        const rect = canvas.getBoundingClientRect();
        touchTarget = {x: (e.clientX-rect.left) * (canvas.width/rect.width), y: (e.clientY-rect.top) * (canvas.height/rect.height)};
    });
    canvas.addEventListener('pointerup', ()=> touchTarget = null);
    canvas.addEventListener('pointercancel', ()=> touchTarget = null);

    function spawnEnemy() {
        // spawn at random edge
        const side = Math.floor(Math.random()*4);
        let x=0,y=0;
        if(side===0){ x = -30; y = Math.random()*H; }
        else if(side===1){ x = W+30; y = Math.random()*H; }
        else if(side===2){ x = Math.random()*W; y = -30; }
        else { x = Math.random()*W; y = H+30; }
        enemies.push({x,y,r:16,spd:60 + Math.random()*70, stunned:0});
    }

    function dist(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return Math.hypot(dx,dy); }

    function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

    function update(dt) {
        if(state !== 'playing') return;

        // Player movement
        let mx=0,my=0;
        if(keys['arrowleft']||keys['a']) mx -= 1;
        if(keys['arrowright']||keys['d']) mx += 1;
        if(keys['arrowup']||keys['w']) my -= 1;
        if(keys['arrowdown']||keys['s']) my += 1;
        if(touchTarget){
            const dx = touchTarget.x - player.x, dy = touchTarget.y - player.y;
            const m = Math.hypot(dx,dy) || 1;
            mx = dx/m; my = dy/m;
        }
        const mlen = Math.hypot(mx,my);
        if(mlen > 0.001){
            player.vx = (mx/mlen) * player.speed;
            player.vy = (my/mlen) * player.speed;
        } else { player.vx = 0; player.vy = 0; }

        player.x += player.vx * dt;
        player.y += player.vy * dt;
        player.x = clamp(player.x, player.r, W-player.r);
        player.y = clamp(player.y, player.r, H-player.r);

        // Space = scare/stun
        if((keys[' '] || keys['space']) && player.stunCooldown <= 0){
            // push enemies within radius
            const radius = 120;
            for(const e of enemies){
                const d = Math.hypot(e.x - player.x, e.y - player.y);
                if(d < radius){
                    const nx = (e.x - player.x)/Math.max(d,0.01);
                    const ny = (e.y - player.y)/Math.max(d,0.01);
                    e.x += nx * 20;
                    e.y += ny * 20;
                    e.stunned = 1.2;
                }
            }
            player.stunCooldown = 1.2;
        }
        player.stunCooldown = Math.max(0, player.stunCooldown - dt);

        // Cow behavior: if player is close and slightly behind, cow moves toward barn guided by player; otherwise wanders
        const pd = Math.hypot(cow.x - player.x, cow.y - player.y);
        const herdRange = 160;
        if(pd < herdRange){
            // move away from threats and toward player direction
            const toPlayer = {x: player.x - cow.x, y: player.y - cow.y};
            const m = Math.hypot(toPlayer.x,toPlayer.y) || 1;
            const steerX = toPlayer.x/m;
            const steerY = toPlayer.y/m;
            // also prefer barn direction when player is near
            const toBarn = {x: barn.x + barn.w/2 - cow.x, y: barn.y + barn.h/2 - cow.y};
            const mb = Math.hypot(toBarn.x,toBarn.y) || 1;
            cow.vx = (steerX*0.6 + toBarn.x/mb*0.4) * 90;
            cow.vy = (steerY*0.6 + toBarn.y/mb*0.4) * 90;
        } else {
            // wander slowly
            cow.calmTimer -= dt;
            if(cow.calmTimer <= 0){
                const ang = Math.random()*Math.PI*2;
                cow.vx = Math.cos(ang) * 30;
                cow.vy = Math.sin(ang) * 30;
                cow.calmTimer = 1 + Math.random()*2;
            }
        }
        cow.x += cow.vx * dt;
        cow.y += cow.vy * dt;
        cow.x = clamp(cow.x, cow.r, W-cow.r);
        cow.y = clamp(cow.y, cow.r, H-cow.r);

        // Enemies chase cow
        spawnTimer -= dt;
        if(spawnTimer <= 0){
            spawnTimer = 2.2 - Math.min(1.5, (Date.now()%100000)/100000*1.2); // some variation
            spawnEnemy();
        }
        for(const e of enemies){
            if(e.stunned > 0){
                e.stunned -= dt;
                continue;
            }
            const dx = cow.x - e.x, dy = cow.y - e.y;
            const m = Math.hypot(dx,dy) || 1;
            e.x += (dx/m) * e.spd * dt;
            e.y += (dy/m) * e.spd * dt;
            // small avoidance between enemies
            for(const f of enemies){
                if(f===e) continue;
                const d = Math.hypot(e.x - f.x, e.y - f.y);
                if(d < 26 && d>0){
                    e.x += (e.x - f.x)/d * 10 * dt;
                    e.y += (e.y - f.y)/d * 10 * dt;
                }
            }
        }

        // Collisions: player pushing enemies
        for(const e of enemies){
            const d = Math.hypot(e.x - player.x, e.y - player.y);
            if(d < e.r + player.r){
                const nx = (e.x - player.x)/Math.max(d,0.01);
                const ny = (e.y - player.y)/Math.max(d,0.01);
                e.x = player.x + nx * (e.r + player.r + 2);
                e.y = player.y + ny * (e.r + player.r + 2);
                e.stunned = 0.6;
            }
        }

        // Check if any enemy touches cow => lose
        for(const e of enemies){
            const d = Math.hypot(e.x - cow.x, e.y - cow.y);
            if(d < e.r + cow.r - 2){
                state = 'lost';
                statusEl.textContent = 'Oh no — the cow was caught! Restart to try again.';
            }
        }
        // Check if cow in barn area => win
        if(cow.x > barn.x && cow.x < barn.x + barn.w && cow.y > barn.y && cow.y < barn.y + barn.h){
            state = 'won';
            statusEl.textContent = 'Saved! The cow is safe in the barn. Well done.';
        }

        // remove far away enemies
        enemies = enemies.filter(e => e.x > -100 && e.x < W+100 && e.y > -100 && e.y < H+100);
    }

    function draw() {
        ctx.clearRect(0,0,W,H);

        // Barn
        ctx.fillStyle = '#7b4f2b';
        ctx.fillRect(barn.x, barn.y, barn.w, barn.h);
        ctx.fillStyle = '#e8d6bb';
        ctx.fillRect(barn.x+10, barn.y+10, barn.w-20, barn.h-20);

        // Decorative grass
        for(let i=0;i<40;i++){
            const gx = (i*73)%W;
            ctx.fillStyle = i%2? '#8bd07f':'#73c669';
            ctx.fillRect(gx, H-20 - (i%3)*4, 6, 20);
        }

        // Cow (simple)
        ctx.save();
        ctx.translate(cow.x, cow.y);
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(0,0, cow.r+6, cow.r, 0,0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.ellipse(-4,-4,5,3,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(6,-2,4,2.4,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffd9b3';
        ctx.beginPath(); ctx.ellipse(0,cow.r*0.4,6,4,0,0,Math.PI*2); ctx.fill();
        ctx.restore();

        // Player
        ctx.beginPath();
        ctx.fillStyle = '#2b6b3a';
        ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
        ctx.fill();

        // Enemies
        for(const e of enemies){
            ctx.beginPath();
            ctx.fillStyle = e.stunned > 0 ? '#ffb3b3' : '#c92b2b';
            ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
            ctx.fill();
            // eyes
            ctx.fillStyle = '#fff';
            ctx.fillRect(e.x-6, e.y-6, 3,3);
            ctx.fillRect(e.x+2, e.y-6, 3,3);
        }

        // HUD: number of enemies
        ctx.fillStyle = '#06321f';
        ctx.font = '16px system-ui,Segoe UI,Roboto,Arial';
        ctx.fillText(`Enemies: ${enemies.length}`, 12, 22);

        // If not playing, overlay message
        if(state === 'idle'){
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(0,0,W,H);
            ctx.fillStyle = '#fff';
            ctx.font = '28px sans-serif';
            ctx.fillText('Press Start to save the cow!', 40, 80);
        } else if(state === 'won' || state === 'lost'){
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.fillRect(0,0,W,H);
            ctx.fillStyle = state==='won' ? '#dff0d8' : '#ffdede';
            ctx.font = '28px sans-serif';
            ctx.fillText(state==='won' ? 'You saved the cow!' : 'The cow was caught!', 40, 80);
            ctx.font = '18px sans-serif';
            ctx.fillText('Click Start / Restart to play again.', 40, 110);
        }
    }

    function loop(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // Responsive canvas
    function resize() {
        const maxW = Math.min(window.innerWidth - 24, 900);
        const scale = maxW / 900;
        canvas.style.width = `${900 * scale}px`;
        canvas.style.height = `${600 * scale}px`;
    }
    window.addEventListener('resize', resize);
    resize();

    // Start initially in idle state with a placed cow
    statusEl.textContent = 'Ready';
    state = 'idle';
})();
</script>
</body>
</html>
