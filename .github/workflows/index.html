<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>siimsander.eu</title>
    <meta name="description" content="Personal website for siimsander.eu" />
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --text: #15212f;
        --muted: #5f6f80;
        --accent: #2463eb;
        --accent-2: #17b7a5;
        --border: rgba(21, 33, 47, 0.08);
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; font-family: Arial, Helvetica, sans-serif; background: linear-gradient(180deg, #edf4ff 0%, var(--bg) 100%); color: var(--text); }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }

      .card {
        width: min(860px, 100%);
        background: rgba(255,255,255,0.9);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: 0 20px 50px rgba(18, 38, 63, 0.10);
        overflow: hidden;
      }

      .hero {
        padding: 48px 32px 28px;
        background: linear-gradient(135deg, rgba(36,99,235,0.08), rgba(23,183,165,0.08));
      }

      .eyebrow {
        display: inline-block;
        font-size: 12px;
        letter-spacing: 0.12em;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.05;
      }

      p {
        margin: 18px 0 0;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.05rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 26px;
      }

      .btn {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        box-shadow: 0 12px 24px rgba(36,99,235,0.22);
      }

      .btn.secondary {
        background: white;
        color: var(--text);
        border: 1px solid var(--border);
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        padding: 24px 32px 32px;
        border-top: 1px solid var(--border);
        background: rgba(255,255,255,0.6);
      }

      .item {
        padding: 18px 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(255,255,255,0.75);
      }

      .label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .value {
        font-size: 1.1rem;
        font-weight: 700;
      }

      footer {
        padding: 0 32px 26px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      @media (max-width: 640px) {
        .hero, .meta, footer { padding-left: 20px; padding-right: 20px; }
        .meta { grid-template-columns: 1fr; }
        .actions { flex-direction: column; align-items: stretch; }
        .btn { text-align: center; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <section class="hero">
        <div class="eyebrow">siimsander.eu</div>
        <h1>Welcome to my website.</h1>
        <p>
          This is a clean static homepage hosted directly from the repository.
          It is ready for deployment to Zone.ee using FTPS.
        </p>

        <div class="actions">
          <a class="btn primary" href="mailto:hello@siimsander.eu">Contact</a>
          <a class="btn secondary" href="https://github.com" target="_blank" rel="noreferrer">GitHub</a>
        </div>
      </section>

      <section class="meta">
        <div class="item">
          <div class="label">Status</div>
          <div class="value">Live</div>
        </div>
        <div class="item">
          <div class="label">Platform</div>
          <div class="value">Static site</div>
        </div>
        <div class="item">
          <div class="label">Hosting</div>
          <div class="value">Zone.ee</div>
        </div>
      </section>

      <footer>
        © <span id="year"></span> siimsander.eu
      </footer>
    </main>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
